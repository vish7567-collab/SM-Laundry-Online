<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Laundry Login</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#064e3b,#0f766e);display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:30px;border-radius:16px;width:min(380px,90vw);box-shadow:0 12px 40px #0003}input{width:100%;padding:13px;margin:8px 0 16px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;padding:13px;background:#087f5b;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.err{color:#b91c1c;min-height:20px}</style></head><body><form class="card" id="login"><h2>SM Laundry</h2><p>Sign in to continue</p><p class="err" id="msg"></p><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Login</button></form><script>const q=new URLSearchParams(location.search);if(q.has('expired'))document.querySelector('#msg').textContent='Session expired after 10 minutes of inactivity. Please login again.';document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Signing in…';try{const r=await fetch('/.netlify/functions/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:f.get('username'),password:f.get('password')})});const d=await r.json();if(!r.ok||d.result!=='success')throw Error(d.message||'Login failed');location.href='/';}catch(x){document.querySelector('#msg').textContent=x.message;}finally{b.disabled=false;b.textContent='Login';}});</script></body></html>
