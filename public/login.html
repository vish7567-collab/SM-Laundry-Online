<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b32"><title>SM Laundry | Secure Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12332e;--muted:#71847f;--green:#087f63;--deep:#073b32;--line:#e2ebe7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Poppins,Manjari,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 18%,#3cc6a0 0,transparent 28%),radial-gradient(circle at 90% 82%,#1c8c7a 0,transparent 30%),linear-gradient(135deg,#052f2a,#0a594b 55%,#073b32);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}body:before{width:520px;height:520px;left:-220px;bottom:-270px}body:after{width:680px;height:680px;right:-330px;top:-370px}
.shell{width:min(100%,980px);min-height:590px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #ffffff35;border-radius:30px;overflow:hidden;background:#ffffff12;box-shadow:0 30px 90px #001b1670;backdrop-filter:blur(18px);position:relative;z-index:1}
.brand{padding:58px 48px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#06483dce,#052f2bd9)}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#b8f2d8,#4ac69b);display:grid;place-items:center;color:#075341;font-size:30px;font-weight:800;box-shadow:0 12px 28px #001f1a55}
.brand h1{font-size:36px;line-height:1.2;margin:28px 0 12px;font-weight:800;letter-spacing:-1.5px}.brand p{color:#d0e8df;line-height:1.9;font-size:14px;max-width:350px}.brand-foot{font-size:11px;color:#b4d4c9;letter-spacing:1.4px;text-transform:uppercase}
.panel{background:#fbfdfc;padding:58px 52px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--green);text-transform:uppercase}.panel h2{font-size:28px;margin:10px 0 6px;letter-spacing:-.8px}.sub{margin:0 0 30px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:600;margin:16px 0 7px;color:#35544c}.field{position:relative}.field input{width:100%;height:51px;padding:0 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font:500 13px Poppins,sans-serif;color:var(--ink);outline:none;transition:.2s}.field input:focus{border-color:#31a889;box-shadow:0 0 0 4px #31a8891b}.field input::placeholder{color:#a5b5af}.show{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#72857e;font-size:11px;font-weight:700;cursor:pointer;padding:6px}
button.submit{margin-top:25px;width:100%;height:52px;border:0;border-radius:12px;background:linear-gradient(110deg,#087f63,#0b9a78);color:white;font:700 14px Poppins,sans-serif;letter-spacing:.3px;cursor:pointer;box-shadow:0 10px 22px #087f6330;transition:transform .18s,box-shadow .18s}button.submit:hover{transform:translateY(-2px);box-shadow:0 14px 28px #087f6340}button.submit:disabled{opacity:.65;cursor:wait;transform:none}.err{min-height:20px;margin:12px 0 0;color:#b42318;font-size:12px;line-height:1.6}.secure{display:flex;align-items:center;gap:7px;color:#83958e;font-size:10px;margin-top:24px}.secure span{color:#0c9975;font-size:14px}
@media(max-width:720px){body{padding:14px}.shell{grid-template-columns:1fr;max-width:440px;min-height:auto;border-radius:24px}.brand{padding:26px 28px 22px;min-height:190px}.logo{width:48px;height:48px;border-radius:15px;font-size:23px}.brand h1{font-size:26px;margin:16px 0 5px}.brand p{font-size:12px;margin:0}.brand-foot{display:none}.panel{padding:34px 28px 38px}.panel h2{font-size:24px}}
</style></head>
<body><main class="shell">
<section class="brand"><div><div class="logo">SM</div><h1>SM Laundry</h1><p>Professional Laundry & Dry Cleaning Management System. Manage orders, collections and daily operations in one place.</p></div><div class="brand-foot">Clean care · Smart management</div></section>
<section class="panel"><div class="eyebrow">Welcome back</div><h2>Sign in to your account</h2><p class="sub">Enter your credentials to continue to the dashboard.</p>
<form id="login"><label for="username">Username</label><div class="field"><input id="username" name="username" autocomplete="username" placeholder="Enter your username" required></div>
<label for="password">Password</label><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="show" type="button" id="togglePassword">SHOW</button></div>
<p class="err" id="msg" role="alert"></p><button class="submit" type="submit">Sign In <span aria-hidden="true">→</span></button></form><div class="secure"><span>●</span> Secure login · Session protected</div></section>
</main><script>
const q=new URLSearchParams(location.search);if(q.has('expired'))document.querySelector('#msg').textContent='Session expired after 10 minutes of inactivity. Please login again.';
document.querySelector('#togglePassword').addEventListener('click',()=>{const p=document.querySelector('#password'),b=document.querySelector('#togglePassword');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'SHOW':'HIDE';});
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('.submit'),msg=document.querySelector('#msg');b.disabled=true;b.textContent='Signing in…';msg.textContent='';try{const r=await fetch('/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:f.get('username'),password:f.get('password')})});const d=await r.json();if(!r.ok||d.result!=='success')throw Error(d.message||'Login failed');location.replace('/');}catch(x){msg.textContent=x.message||'Unable to sign in. Please try again.';}finally{b.disabled=false;b.innerHTML='Sign In <span aria-hidden="true">→</span>';}});
</script></body></html>
